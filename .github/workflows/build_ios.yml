name: Build Playfun iOS (Unsigned for Sideloadly)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
      COCOAPODS_DISABLE_STATS: 'true'
      SWIFT_PACKAGE_MANAGER_DISABLE: '1'
      FLUTTER_DISABLE_SPM: '1'
      COCOAPODS_DISABLE_SPM: '1'

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: 🛠️ Activer Xcode 16
        run: |
          DEVELOPER_DIR=$(find /Applications -maxdepth 1 -name "Xcode*16*.app" | sort -V | tail -n 1)/Contents/Developer
          if [ -d "$DEVELOPER_DIR" ]; then
            echo "✅ Utilisation de : $DEVELOPER_DIR"
            sudo xcode-select -s "$DEVELOPER_DIR"
          else
            echo "ℹ️ Xcode 16 non trouvé spécifiquement, utilisation de la version par défaut :"
          fi
          xcodebuild -version

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚙️ Désactiver Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: 🧹 Nettoyage Complet (Critical)
        run: |
          flutter clean
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          cd ..

      - name: 📦 Récupérer les dépendances Flutter
        run: flutter pub get

      - name: ⚙️ Préparer la config Flutter
        run: flutter build ios --release --config-only --no-codesign

      - name: 🍫 Installer CocoaPods (Dernier mot sur la config)
        run: |
          cd ios
          export COCOAPODS_DISABLE_STATS=true
          export SWIFT_PACKAGE_MANAGER_DISABLE=1
          export FLUTTER_DISABLE_SPM=1
          export COCOAPODS_DISABLE_SPM=1
          pod install --repo-update

          # Patch FIRRecaptchaProvider with clean stub
          ruby -e '
            f = "Pods/FirebaseAppCheck/FirebaseAppCheck/Sources/RecaptchaProvider/FIRRecaptchaProvider.m"
            if File.exist?(f)
              File.chmod(0644, f)
              File.write(f, "#import \"FirebaseAppCheck/Sources/Public/FirebaseAppCheck/FIRRecaptchaProvider.h\"\n\n@implementation FIRRecaptchaProvider\n+ (BOOL)isSupported { return NO; }\n- (nullable instancetype)initWithApp:(FIRApp *)app siteKey:(NSString *)siteKey { return nil; }\n- (void)getTokenWithCompletion:(void (^)(FIRAppCheckToken *, NSError *))h { if (h) h(nil, [NSError errorWithDomain:@\"FIRRecaptchaProvider\" code:-1 userInfo:nil]); }\n- (void)getLimitedUseTokenWithCompletion:(void (^)(FIRAppCheckToken *, NSError *))h { [self getTokenWithCompletion:h]; }\n@end\n")
              puts "✅ Patched FIRRecaptchaProvider.m with clean stub"
            end
          '
          cd ..

      - name: 🔨 Compiler avec xcodebuild (Sans signature)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            BUILD_DIR=build/ios \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

          RUNNER_APP=$(find build/ios -name "Runner.app" | grep -E "Release-iphoneos|iphoneos" | head -n 1)
          if [ -n "$RUNNER_APP" ] && [ -d "$RUNNER_APP" ]; then
            echo "✅ Build Device réussie : $RUNNER_APP"
            echo "RUNNER_APP_PATH=$RUNNER_APP" >> $GITHUB_ENV
          else
            echo "❌ Erreur : Runner.app introuvable dans build/ios/"
            find build/ios -maxdepth 4
            exit 1
          fi

      - name: 📦 Créer le fichier .IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r "$RUNNER_APP_PATH" build/ipa/Payload/Runner.app
          cd build/ipa
          zip -r Playfun_unsigned.ipa Payload/
          cd ../..

      - name: 🚀 Télécharger l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: Playfun-iOS-IPA
          path: build/ipa/Playfun_unsigned.ipa
          retention-days: 7
