# Allouer suffisamment de mémoire et désactiver le fallback réseau RMI
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Empêche le démon Kotlin de se bloquer en boucle
kotlin.compiler.execution.strategy=in-process

# R8 et optimisations
android.enableR8.fullMode=true
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false


